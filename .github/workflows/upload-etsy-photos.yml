# Uploads listing photos from etsy-photos/<folder>/ to Etsy, for the jobs in data/etsy-photos.json
# (needs Etsy connected: see README "Etsy connection"). Leave "dry run" on to only check.
name: Upload Etsy photos

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check only, change nothing on Etsy)"
        type: boolean
        default: true
      only:
        description: "Only these job ids, comma-separated (blank = all not done)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: shop-data
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload photos
        run: node scripts/upload-etsy-photos.mjs
        env:
          ETSY_ADMIN_KEY: ${{ secrets.ETSY_ADMIN_KEY }}
          SHOP_URL: ${{ vars.SHOP_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.only }}
      - name: Save the results
        if: always()
        run: |
          git config user.name "Etsy photos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etsy-photos.json data/etsy-photos-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Etsy photos: results"
            git pull --rebase origin main
            git push
          fi
