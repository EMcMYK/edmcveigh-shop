# Adds new Etsy listings to the shop and updates existing ones from Etsy (see scripts/etsy-sync.mjs).
# Runs every morning, and any time you press "Run workflow" on the Actions tab
# (github.com/EMcMYK/edmcveigh-shop → Actions → Sync from Etsy → Run workflow).
name: Sync from Etsy

on:
  schedule:
    - cron: "52 10 * * *"   # every day around 6:50am Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shop-data          # never runs at the same time as a "mark sold" update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync listings and photos
        run: node scripts/etsy-sync.mjs
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_ADMIN_KEY: ${{ secrets.ETSY_ADMIN_KEY }}
          SHOP_URL: ${{ vars.SHOP_URL }}
      - name: Save changes (Cloudflare republishes the shop a minute later)
        if: always()   # a held-back price still saves everything else
        run: |
          git config user.name "Etsy sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data images
          if git diff --cached --quiet; then
            echo "Nothing changed on Etsy."
          else
            git commit -m "Sync from Etsy"
            git pull --rebase origin main
            git push
          fi
